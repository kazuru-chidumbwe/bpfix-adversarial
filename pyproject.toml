[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpfix-adversarial"
version = "1.1.0"
description = "Scores where eBPF verifier diagnostics point relative to the lines developers change to fix the rejected program, and whether that answer survives rewrites the verifier sees."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Seke Kazuru" }]
dependencies = []

[project.optional-dependencies]
lab = ["paramiko>=3.5,<4"]
dev = ["coverage>=7.16,<8"]
all = ["bpfix-adversarial[lab,dev]"]

[project.scripts]
bpfix-adversarial = "bpfix_adversarial.cli:main"

[tool.setuptools.packages.find]
include = ["bpfix_adversarial*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
