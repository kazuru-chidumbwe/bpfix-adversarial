[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bpfix-adversarial"
version = "1.0.1"
description = "Check whether eBPF reject diagnostics still name the line where a fault was injected after pad and rename stress."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Seke Kazuru" }]
dependencies = []

[project.optional-dependencies]
lab = ["paramiko>=3.5,<4"]
openai = ["openai>=1.97,<2"]
all = ["bpfix-adversarial[lab,openai]"]

[project.scripts]
bpfix-adversarial = "bpfix_adversarial.cli:main"

[tool.setuptools.packages.find]
include = ["bpfix_adversarial*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
