# CI: unit tests and release hygiene

name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12"]
        # A default Windows clone uses core.autocrlf=true. Without the LF rules
        # in .gitattributes that rewrites the committed SVGs and
        # check_results_fresh.py reports them stale, so the Windows claim needs
        # testing on a checkout that actually converts line endings. Same steps
        # as Linux, one source of truth.
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - name: Force Windows default line-ending conversion
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e .
      - name: Version sync (package, pyproject, CITATION.cff, codemeta, C1)
        run: python tools/check_version_sync.py
      - name: LF-only fixture logs (no CRLF)
        run: python tools/check_lf_logs.py
      - name: Committed results match offline emitters
        run: python tools/check_results_fresh.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
