# CI — unit tests + release hygiene

name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install -U pip
          pip install -e .
      - name: Version sync (__init__ == pyproject.toml)
        run: python tools/check_version_sync.py
      - name: LF-only fixture logs (no CRLF)
        run: python tools/check_lf_logs.py
      - name: Committed results match offline emitters
        run: python tools/check_results_fresh.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
